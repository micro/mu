syntax = "proto3";
package mu.assistant.v1;
option go_package = "mu/proto/assistant/v1;assistantv1";
option java_package = "mu.client.proto.assistant.v1";
option java_multiple_files = true;
service Services {
 rpc List(ListServicesRequest) returns (ListServicesResponse);
 rpc Describe(DescribeServiceRequest) returns (ServiceDescriptor);
}
message ServiceDescriptor {
 string name = 1;
 string description = 2;
 // Only implemented MUCP operations; discovery does not grant permission.
 repeated ServiceOperation operations = 3;
 string contract = 4;
}
message ServiceOperation { string endpoint = 1; string description = 2; bool writes = 3; bool destructive = 4; }
message ListServicesRequest { int32 page_size = 1; string page_token = 2; }
message ListServicesResponse { repeated ServiceDescriptor services = 1; string next_page_token = 2; }
message DescribeServiceRequest { string name = 1; }
