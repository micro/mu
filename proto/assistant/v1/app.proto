syntax = "proto3";
package mu.assistant.v1;
option go_package = "mu/proto/assistant/v1;assistantv1";
option java_package = "mu.micro.client.proto.assistant.v1";
option java_multiple_files = true;
import "assistant/v1/pay.proto";

// Hosted single-agent app configuration. Publishing is explicit execution consent
// for authenticated customers using public tools, never the creator's private data.
message AgentApp {
  bool published = 1;
  string name = 2;
  string description = 3;
  bool paid = 4;
  string icon = 5; // Server-generated content hash, not an arbitrary URL.
}
// Browser binding: POST /agent/{name}/app/chat.
message AppPrompt {
  string prompt = 1;
  string thread = 2;
  string session = 3;
}
message AppAnswer {
  string text = 1;
  string thread = 2;
}

// Customer HTTP binding under /agent/{slug}/app/; api:agent + read/write.
// GET profile; POST threads (ListThreadsRequest); POST history (ReadThreadRequest);
// POST chat (AppPrompt); GET sessions; GET/POST session/{id} (read/start).
// Threads and history return ListThreadsResponse and ReadThreadResponse.
message AppProfile {
 string id = 1;
 string slug = 2;
 string name = 3;
 string description = 4;
 bool paid = 5;
}
message AppSessions { repeated PaidSession sessions = 1; }
