// Authoritative Notes service contract. Go handlers implement these messages.
syntax = "proto3";
package mu.service.notes.v1;
option go_package = "mu/proto/service/notes/v1;notesv1";
option java_package = "mu.micro.client.proto.service.notes.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "service/options.proto";

service Notes {
  // Write a note under a title, so it is there next conversation. Writing a title that exists rewrites that note
  rpc Add(AddRequest) returns (AddResponse);
  // Delete one note by title
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Read one note by title. Use it when you know the title; notes_list when you do not
  rpc Get(GetRequest) returns (GetResponse);
  // List every note the caller has written, with its text
  rpc List(ListRequest) returns (ListResponse);
}

message AddRequest {
  // What the note is called, e.g. "location" or "project brief". Writing a title that exists rewrites that note
  string title = 1 [json_name = "title", (mu.service.required) = true, (mu.service.description) = "What the note is called, e.g. \"location\" or \"project brief\". Writing a title that exists rewrites that note"];
  // What the note says
  string text = 2 [json_name = "text", (mu.service.required) = true, (mu.service.description) = "What the note says"];
}

message AddResponse {
  ResultEmbed item = 1 [json_name = "item"];
  // Open the saved note
  string url = 2 [json_name = "url", (mu.service.description) = "Open the saved note"];
  // Confirmation
  string result = 3 [json_name = "result", (mu.service.description) = "Confirmation"];
}

message DeleteRequest {
  // The note to delete, as returned by notes_list
  string title = 1 [json_name = "title", (mu.service.required) = true, (mu.service.description) = "The note to delete, as returned by notes_list"];
}

message DeleteResponse {
  // Confirmation
  string result = 1 [json_name = "result", (mu.service.description) = "Confirmation"];
}

message GetRequest {
  // The note's title, as given to notes_add
  string title = 1 [json_name = "title", (mu.service.required) = true, (mu.service.description) = "The note's title, as given to notes_add"];
}

message GetResponse {
  ResultEmbed item = 1 [json_name = "item"];
  // What the note says, or empty if there is no note by that title
  string text = 2 [json_name = "text", (mu.service.description) = "What the note says, or empty if there is no note by that title"];
  // The title and its text, or a note that nothing is written under it
  string note = 3 [json_name = "note", (mu.service.description) = "The title and its text, or a note that nothing is written under it"];
}

message ListRequest {
}

message ListResponse {
  // Every note the caller has written
  repeated Note notes = 1 [json_name = "notes", (mu.service.description) = "Every note the caller has written"];
}

message Note {
  string source_thread = 1 [json_name = "source_thread"];
  google.protobuf.Timestamp updated_at = 2 [json_name = "updated_at"];
  // What the note is called
  string title = 3 [json_name = "title", (mu.service.description) = "What the note is called"];
  // What it says
  string text = 4 [json_name = "text", (mu.service.description) = "What it says"];
}

message ResultEmbed {
  string body = 1 [json_name = "body"];
  string kind = 2 [json_name = "kind"];
  string id = 3 [json_name = "id"];
  string url = 4 [json_name = "url"];
  string title = 5 [json_name = "title"];
  string summary = 6 [json_name = "summary"];
  repeated ResultPoint shape = 7 [json_name = "shape"];
  repeated string steps = 8 [json_name = "steps"];
}

message ResultPoint {
  double lat = 1 [json_name = "Lat"];
  double lon = 2 [json_name = "Lon"];
}

