// Authoritative public service contract. Go handlers implement these generated types.
syntax = "proto3";
package mu.service.notify.v1;
option go_package = "mu/proto/service/notify/v1;notifyv1";
option java_package = "mu.micro.client.proto.service.notify.v1";
option java_multiple_files = true;

import "service/options.proto";

service Notify {
  // Whether this account can be reached by notification at all, and on which devices. Worth asking before promising to tell somebody something
  rpc Devices(DevicesRequest) returns (DevicesResponse);
  // Interrupt yourself on your own devices — a phone, a laptop — with the page closed. For the thing that cannot wait until the next time somebody looks. An answer to a question belongs in the thread it was asked in, not here
  rpc Send(SendRequest) returns (SendResponse);
}

message Device {
  // What the device said it was, as far as the browser will say
  string label = 1 [json_name = "label", (mu.service.description) = "What the device said it was, as far as the browser will say"];
  // When it was turned on
  string added = 2 [json_name = "added", (mu.service.description) = "When it was turned on"];
  // What became of the last notification sent here
  string last = 3 [json_name = "last", (mu.service.description) = "What became of the last notification sent here"];
}

message DevicesRequest {
}

message DevicesResponse {
  // Every device this account can be reached on
  repeated Device devices = 1 [json_name = "devices", (mu.service.description) = "Every device this account can be reached on"];
  // Whether a notification sent right now would have anywhere to go
  bool reachable = 2 [json_name = "reachable", (mu.service.description) = "Whether a notification sent right now would have anywhere to go"];
}

// Notifications only target the authenticated caller; no recipient override.
message SendRequest {
  // The line on the lock screen. Short — this is the whole message on a watch
  string title = 1 [json_name = "title", (mu.service.description) = "The line on the lock screen. Short — this is the whole message on a watch", (mu.service.required) = true];
  // A second line, up to about 300 characters. Optional
  string body = 2 [json_name = "body", (mu.service.description) = "A second line, up to about 300 characters. Optional"];
  // Where tapping it goes, e.g. /inbox. A notification you cannot act on trains someone to ignore the next one
  string url = 3 [json_name = "url", (mu.service.description) = "Where tapping it goes, e.g. /inbox. A notification you cannot act on trains someone to ignore the next one"];
}

message SendResponse {
  // Confirmation, or why it could not be delivered
  string result = 1 [json_name = "result", (mu.service.description) = "Confirmation, or why it could not be delivered"];
}

