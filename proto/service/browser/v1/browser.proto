service Browser {
  // Open a page in a real browser and read it after its JavaScript has run. Use it when web_fetch comes back empty or with only a nav bar, which is what a page that builds itself in the browser looks like to a plain fetch. web_fetch is free and is the right first try; this costs, because it runs a browser
  rpc Read(ReadRequest) returns (ReadResponse);
  // Photograph a page and get back a URL for the picture. What it looks like, rather than what it says — a chart, a layout, a page whose content is an image. Ask for full to capture past the first screenful
  rpc Shot(ShotRequest) returns (ShotResponse);
}

message ReadRequest {
  // The page to open
  string url = 1 [json_name = "url"];
  // Optional CSS selector to wait for before reading, for content that arrives late
  string wait = 2 [json_name = "wait"];
}

message ReadResponse {
  // The page's title
  string title = 1 [json_name = "title"];
  // The page's visible text, after its JavaScript has run
  string text = 2 [json_name = "text"];
  // Where the browser ended up, which is not the URL asked for when the page redirected
  string url = 3 [json_name = "url"];
}

message ShotRequest {
  // The page to photograph
  string url = 1 [json_name = "url"];
  // Capture the whole page rather than one screenful
  bool full = 2 [json_name = "full"];
  // Optional CSS selector to wait for before the shot
  string wait = 3 [json_name = "wait"];
}

message ShotResponse {
  // Where the picture is, on this instance
  string url = 1 [json_name = "url"];
  // The page's title
  string title = 2 [json_name = "title"];
}

