syntax = "proto3";
package mu.service.shell.v1;
option go_package = "mu/proto/service/shell/v1;shellv1";
option java_package = "mu.micro.client.proto.service.shell.v1";
option java_multiple_files = true;


service Shell {
  // Run a shell command in your account's container sandbox and get back what it wrote. A real shell in a container: pipes, redirection and && all work, the working directory is /work and files there persist between calls. Use it to build, test, run scripts and move files about. A non-zero exit code comes back in the response rather than as an error, so read the output — a failing build is an answer
  rpc Run(RunRequest) returns (RunResponse);
  // Put a file in your account's container sandbox, creating any missing directories. The only file operation that is not a shell command, because it is the one a shell is bad at: source is full of quotes and backticks and a heredoc will mangle it. The content arrives as a string and reaches the file without a shell seeing it. To read, list, search or change a file, use the shell — cat, ls, grep and sed are right there
  rpc Write(WriteRequest) returns (WriteResponse);
}

message RunRequest {
  // A shell command to run, e.g. 'go test ./... 2>&1 | tail -40'
  string command = 1 [json_name = "command"];
  // Directory to run it in, under /work. Defaults to /work
  string dir = 2 [json_name = "dir"];
  // Seconds to allow, up to the instance's maximum. Defaults to 120
  int64 timeout = 3 [json_name = "timeout"];
}

message RunResponse {
  // Everything the command wrote, stdout and stderr interleaved as they happened
  string output = 1 [json_name = "output"];
  // The exit status. 0 is success; anything else is the command's own failure, not an error from this service
  int64 code = 2 [json_name = "code"];
}

message WriteRequest {
  // Where to put it, relative to /work — not to the directory your last command left you in. Missing directories are created
  string path = 1 [json_name = "path"];
  // The whole file. This replaces what was there
  string content = 2 [json_name = "content"];
}

message WriteResponse {
  // Where it went
  string path = 1 [json_name = "path"];
  // How much was written
  int64 bytes = 2 [json_name = "bytes"];
}

