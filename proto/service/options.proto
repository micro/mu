syntax = "proto3";
package mu.service;
option go_package = "mu/proto/service;servicepb";
option java_package = "mu.client.proto.service";
import "google/protobuf/descriptor.proto";
// Input metadata shared by tool schemas and direct clients. Enforcement remains
// in the service implementation; this is not proto2 wire-level requiredness.
extend google.protobuf.FieldOptions {
  string description = 50001;
  bool required = 50002;
}
