name: CLI

on:
  pull_request:
    paths: ['client/cli/**', '.github/workflows/cli.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['client/cli/**', '.github/workflows/cli.yml', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client/cli
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o mu-cli${{ runner.os == 'Windows' && '.exe' || '' }} .
