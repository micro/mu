name: Protocol contracts
on:
  pull_request:
    paths: ['proto/**', '.github/workflows/proto.yml']
  push:
    branches: [main]
    paths: ['proto/**', '.github/workflows/proto.yml']
permissions:
  contents: read
jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler
        run: python -m pip install grpcio-tools==1.76.0
      - name: Compile assistant contract
        run: |
          mkdir -p "$RUNNER_TEMP/mu-proto"
          python -m grpc_tools.protoc -I proto --include_imports --descriptor_set_out="$RUNNER_TEMP/mu-proto/assistant.pb" proto/assistant/v1/assistant.proto
