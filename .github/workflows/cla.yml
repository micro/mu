name: Contributor agreement
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Never check out a PR head or run its code with this write-capable token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record trusted revision
        run: echo "TRUSTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify contributor agreement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cla.py
