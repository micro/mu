name: Release

# Cut a release by updating VERSION on main, or:
#   - push a version tag:  git tag v0.30.0 && git push origin v0.30.0
#   - or run this workflow manually (Actions tab / dispatch) with a tag input
# Either way it cross-compiles the single Mu binary for linux/macOS
# (amd64+arm64) and attaches them to the GitHub release as mu-<os>-<arch> —
# the exact names install.sh downloads on machines without Go.

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to cut (e.g. v0.30.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            tag="$(cat VERSION)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/mu-${os}-${arch}"
            echo "Building ${out}"
            # -X stamps the release version so `mu version` and /version
            # report the tag rather than "dev".
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath \
                -ldflags "-s -w -X mu/internal/version.Version=${TAG}" \
                -o "${out}" .
          done
          ls -lh dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android client
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/micro-release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
            chmod 600 "$ANDROID_KEYSTORE"
            test -n "$ANDROID_STORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
          fi
          gradle -p client/android --no-daemon testDebugUnitTest lintDebug assembleRelease -PreleaseVersion="$TAG"
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp client/android/app/build/outputs/apk/release/micro-android.apk dist/micro-android.apk
          else
            cp client/android/app/build/outputs/apk/release/micro-android-unsigned.apk dist/micro-android-unsigned.apk
            echo "::warning::Android signing is not configured. The unsigned APK cannot be installed until signed."
          fi

      - name: Publish release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Creates the tag (at this commit) and release if missing; on a
          # re-run, just overwrites the attached binaries.
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
          || gh release upload "${TAG}" dist/* --clobber
