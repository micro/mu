name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  storage-docs-fixup:
    if: github.event_name == 'pull_request' && github.head_ref == 'asim/s3-storage-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update object storage docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/INSTALL.md')
          s = p.read_text()

          s = s.replace(
              '| `S3_ACCESS_KEY` · `S3_SECRET_KEY` | — | Credentials |',
              '| `S3_ACCESS_KEY_ID` · `S3_SECRET_ACCESS_KEY` | — | Credentials used by Files and backups |',
          )

          old = '''Keep the bucket **private**. Files are served through Mu, which checks who is
          asking — a public bucket would let anyone holding an object URL route around
          that.
          '''
          new = '''Keep the bucket **private**. Files are served through Mu, which checks who is
          asking — a public bucket would let anyone holding an object URL route around
          that. The bucket is shared by durable services with fixed namespaces: Files
          uses `files/` and off-box backups use `backups/`.
          '''
          if old not in s:
              raise SystemExit('file storage paragraph not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '| `S3_BUCKET` | — | Bucket for off-box backups. A snapshot on the same disk survives a bad write and not the disk; this is the copy that survives losing the machine. Later it is also where files and generated images belong, which is why these are named for the storage rather than for the backup |',
              '| `S3_BUCKET` | — | Shared bucket for durable storage. Files use `files/`; off-box backups use `backups/` |',
          )
          s = s.replace(
              '| `S3_ACCESS_KEY_ID` | — | Access key. Give it write access to this bucket and nothing else: it is on a machine that runs model output |',
              '| `S3_ACCESS_KEY_ID` | — | Access key for the bucket. Files need read, write and delete access; backups use the same credentials |',
          )
          s = s.replace(
              '| `S3_SECRET_ACCESS_KEY` | — | Secret key |\n| `S3_PREFIX` | — | Optional path inside the bucket, so one bucket can hold several instances |\n| `BACKUP_S3` | `false` | Whether backups are pushed to the bucket above |',
              '| `S3_SECRET_ACCESS_KEY` | — | Secret key |\n| `BACKUP_S3` | `false` | Whether backups are pushed to the bucket above under `backups/` |',
          )

          p.write_text(s)
          PY

      - name: Commit docs
        run: |
          if git diff --quiet -- docs/INSTALL.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/INSTALL.md
          git commit -m 'Document shared object storage configuration'
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short -count=1 -timeout 120s

      - name: Test (race detector)
        run: go test ./... -short -race -count=1 -timeout 180s

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Every target the release cuts, not just the one this runner is.
      #
      # v1.5.0 has no binaries attached because this was `go build .` on
      # linux/amd64 and the release cross-compiles four. internal/container's
      # pty used TIOCSPTLCK and TIOCGPTN with no build constraint, so both
      # darwin targets failed to compile — and `set -e` took the whole step
      # down before `gh release create` ran. Everything was green on main;
      # the first sign was a release with nothing in it, and the first person
      # to feel it was somebody running the documented installer without Go.
      #
      # A tag is the worst place to learn a platform does not compile. It
      # costs a couple of minutes here and it is the difference between a
      # failed build and a silent hole in the install path.
      - name: Build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -o /dev/null .
          done
