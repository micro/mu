name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Validate pull requests once; main builds the artifact that is deployed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short -count=1 -timeout 120s

      - name: Test (race detector)
        run: go test ./... -short -race -count=1 -timeout 180s

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # PRs verify every release platform; main builds deployment artifacts only.
      - name: Build binaries
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/mu-build"
          targets="linux/amd64 linux/arm64"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            targets="$targets darwin/amd64 darwin/arm64"
          fi
          for target in $targets; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -o "$RUNNER_TEMP/mu-build/mu-${os}-${arch}" .
          done

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-amd64
          path: ${{ runner.temp }}/mu-build/mu-linux-amd64
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-arm64
          path: ${{ runner.temp }}/mu-build/mu-linux-arm64
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
