name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone web client
        run: |
          npm ci --prefix client/web
          client/web/node_modules/.bin/tsc -p client/typescript
          git diff --exit-code -- client/typescript/dist
          npm test --prefix client/typescript
          PYTHONPATH=client/python python -m unittest discover -s client/python/tests
          python -m pip install mypy==2.4.1
          python -m mypy client/python/mu
          npm test --prefix client/web
          npm run build --prefix client/web
          git diff --exit-code -- client/web/static
          test -z "$(git ls-files --others --exclude-standard client/web/static)"

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-

      - name: Verify formatting
        run: test -z "$(gofmt -l internal/ai/image.go internal/ai/image_test.go service/images/images.go service/images/upload.go)"

      - name: Require browser isolation test runtime
        run: test -x "$CHROME_PATH"

      - name: Allow Chrome to create its sandbox on the CI runner
        run: |
          # Ubuntu's user-namespace policy needs a profile for the real binary.
          # This grants only Chrome permission to create its own sandbox.
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile mu-ci-chrome /opt/google/chrome/chrome flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/mu-ci-chrome >/dev/null
          sudo /usr/sbin/apparmor_parser -r /etc/apparmor.d/mu-ci-chrome
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox

      - name: Test security boundaries and backend
        run: go test ./... -short -count=1

      - name: Test responsive runtime navigation in Chrome
        env:
          UI_SCREENSHOTS: ${{ runner.temp }}/assistant-screenshots
        run: go test ./internal/app -run '^TestResponsiveRuntimeNavigation$' -count=1 -timeout=5m

      - name: Test group creation and reliable messaging in Chrome
        env:
          UI_SCREENSHOTS: ${{ runner.temp }}/assistant-screenshots
        run: go test ./internal/server -run '^TestGroupChatBrowser$' -count=1 -timeout=3m

      - name: Test focused assistant in Chrome
        env:
          UI_SCREENSHOTS: ${{ runner.temp }}/assistant-screenshots
        run: go test ./client/web -run '^Test(Focused|Hosted)ClientBrowser$' -count=1 -timeout=3m

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-screenshots
          path: ${{ runner.temp }}/assistant-screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Race-test security boundaries
        run: go test -race ./internal/auth ./internal/hosts ./internal/service ./internal/api ./internal/server ./service/browser ./service/shell ./x402/billing -short -count=1

      # PRs verify every release platform; main builds deployment artifacts only.
      - name: Build binaries
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/mu-build"
          targets="linux/amd64 linux/arm64"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            targets="$targets darwin/amd64 darwin/arm64"
          fi
          for target in $targets; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -o "$RUNNER_TEMP/mu-build/mu-${os}-${arch}" .
          done

      - name: Test release binary crash recovery
        run: python3 proto/conformance/deployment.py "$RUNNER_TEMP/mu-build/mu-linux-amd64"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-amd64
          path: ${{ runner.temp }}/mu-build/mu-linux-amd64
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-arm64
          path: ${{ runner.temp }}/mu-build/mu-linux-arm64
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
