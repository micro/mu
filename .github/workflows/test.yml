name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Validate pull requests once; main builds the artifact that is deployed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short -count=1 -timeout 120s

  race:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ matrix.shard }}-
      - name: Test (race detector)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: |
          go list ./... > "$RUNNER_TEMP/all-packages"
          python .github/scripts/race-packages.py "$SHARD_INDEX" "$SHARD_COUNT" < "$RUNNER_TEMP/all-packages" > "$RUNNER_TEMP/shard-packages"
          mapfile -t packages < "$RUNNER_TEMP/shard-packages"
          test "${#packages[@]}" -gt 0
          printf '%s\n' "${packages[@]}"
          go test "${packages[@]}" -short -race -count=1 -timeout 180s

  # Keep the existing required check name; every race shard must succeed.
  test:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [unit, race]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: test "$UNIT_RESULT" = success && test "$RACE_RESULT" = success

  layout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify embedded web client
        run: |
          npm ci --prefix web
          npm run build --prefix web
          git diff --exit-code -- web/dist
          test -z "$(git ls-files --others --exclude-standard web/dist)"
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mu-layout" playwright@1.62.1
          "$RUNNER_TEMP/mu-layout/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check mobile and desktop layouts
        run: |
          export MU_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mu-layout/node_modules/playwright"
          export MU_LAYOUT_BROWSER=$(node -e 'console.log(require(process.env.MU_PLAYWRIGHT_MODULE).chromium.executablePath())')
          export MU_LAYOUT_SHOTS="$RUNNER_TEMP/mu-layout-shots"
          go test ./test -run '^Test(PageComposition|ReactClient|ReactApplications)InBrowser$' -count=1 -timeout=10m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: ${{ runner.temp }}/mu-layout-shots
          retention-days: 7


  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-

      # PRs verify every release platform; main builds deployment artifacts only.
      - name: Build binaries
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/mu-build"
          targets="linux/amd64 linux/arm64"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            targets="$targets darwin/amd64 darwin/arm64"
          fi
          for target in $targets; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -o "$RUNNER_TEMP/mu-build/mu-${os}-${arch}" .
          done

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-amd64
          path: ${{ runner.temp }}/mu-build/mu-linux-amd64
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-arm64
          path: ${{ runner.temp }}/mu-build/mu-linux-arm64
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
