name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache Go compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-all-

      - name: Verify image provider logging
        run: |
          test -z "$(gofmt -l internal/ai/image.go internal/ai/image_test.go service/images/images.go service/images/upload.go)"
          go test ./internal/ai -run '^TestImageRequestsRecordOutcomes$' -count=1

      # PRs verify every release platform; main builds deployment artifacts only.
      - name: Build binaries
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/mu-build"
          targets="linux/amd64 linux/arm64"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            targets="$targets darwin/amd64 darwin/arm64"
          fi
          for target in $targets; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -o "$RUNNER_TEMP/mu-build/mu-${os}-${arch}" .
          done

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-amd64
          path: ${{ runner.temp }}/mu-build/mu-linux-amd64
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mu-linux-arm64
          path: ${{ runner.temp }}/mu-build/mu-linux-arm64
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
