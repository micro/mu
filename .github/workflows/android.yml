name: Android launcher
on:
  push:
    branches: [main]
    paths: ['android/**', 'agent/local/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'agent/local/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build embedded Mu
        working-directory: android/runtime
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 26 -o ../app/libs/mu.aar .
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: micro-launcher-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
