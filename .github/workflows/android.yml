name: Android client
on:
  pull_request:
    paths: ['client/android/**', '.github/workflows/android.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['client/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build
        working-directory: client/android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease -PreleaseVersion="$(cat ../../VERSION)"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check account screen on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p client/android --no-daemon connectedDebugAndroidTest -PreleaseVersion="$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: mu-android-preview
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: client/android/app/build/reports
