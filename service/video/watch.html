<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>%s | Micro</title>
  <link rel="stylesheet" href="/mu.css?v=video-2-%s">
</head>
<body class="video-player-body">
  <div class="video-embed">
    %s
    <div class="audio-vis" id="audioVis" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <nav class="video-bar" aria-label="Playback controls">
    <a href="/video">Video</a>
    <button id="audioBtn" type="button" aria-pressed="false">♫ Audio only</button>
    <button id="playBtn" type="button" class="d-none" aria-label="Play">▶</button>
    <span id="audioTime"></span>
    <details class="disclosure video-info">
      <summary>More</summary>
      <div class="video-info-panel">
        <strong>%s</strong>
        <p>%s</p>
        <div class="reading-actions">%s</div>
      </div>
    </details>
  </nav>
  %s
  <script src="/mu.js?v=video-2"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
