plugins { id 'com.android.application'; id 'com.google.protobuf' }

// One codebase, with immutable identity for independently distributed agent apps.
def configPath = providers.gradleProperty('agentApp').orNull
def branded = configPath != null
def configFile = branded ? file(configPath) : null
def brand = branded ? new groovy.json.JsonSlurper().parse(configFile) : [:]
def packageName = branded ? brand.packageId : 'mu.client.android'
def appName = branded ? brand.name : 'Mu'
def server = branded ? brand.server : ''
def agentName = branded ? brand.agent : ''
def icon = branded ? new File(brand.icon ?: '') : null
if (branded && !icon.isAbsolute()) icon = new File(configFile.parentFile, brand.icon ?: '')
if (branded) {
    if (!(packageName instanceof String) || !(packageName ==~ /mu\.micro\.agent\.[a-z][a-z0-9]{0,63}/))
        throw new GradleException('packageId must be mu.micro.agent.<lowercase identifier>')
    if (!(appName instanceof String) || appName.trim().isEmpty() || appName.length() > 60 || (appName =~ /[\p{Cntrl}]/).find())
        throw new GradleException('name must contain 1–60 printable characters')
    def uri
    try { uri = new URI(server) } catch (Exception ignored) { throw new GradleException('server must be an HTTPS origin') }
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment || !(uri.path in ['', '/']))
        throw new GradleException('server must be an HTTPS origin')
    server = new URI('https', null, uri.host, uri.port, null, null, null).toString()
    if (!(agentName instanceof String) || !(agentName ==~ /[a-z0-9][a-z0-9_-]{0,79}/))
        throw new GradleException('agent must be its reserved URL name')
    if (!icon.isFile() || icon.length() > 4 * 1024 * 1024)
        throw new GradleException('icon must be a local PNG up to 4 MB')
    def image = javax.imageio.ImageIO.read(icon)
    if (!icon.name.toLowerCase().endsWith('.png') || image == null || image.width != image.height || image.width < 192 || image.width > 2048)
        throw new GradleException('icon must be a square PNG, 192–2048 pixels')
}
def quoted = { value -> groovy.json.JsonOutput.toJson(value) }

def releaseName = providers.gradleProperty('releaseVersion').getOrElse('0.0.0').replaceFirst('^v', '')
def parts = releaseName.tokenize('.')
if (parts.size() != 3 || parts.any { !(it ==~ /[0-9]+/) || it.toInteger() > 999 }) {
    throw new GradleException('releaseVersion must be major.minor.patch (each 0–999)')
}
android {
    namespace 'mu.client.android'
    compileSdk 36
    defaultConfig {
        applicationId packageName
        resValue 'string', 'app_name', quoted(appName)
        buildConfigField 'boolean', 'BRANDED', branded.toString()
        buildConfigField 'String', 'FIXED_SERVER', quoted(server)
        buildConfigField 'String', 'FIXED_AGENT', quoted(agentName)
        buildConfigField 'String', 'APP_NAME', quoted(appName)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 36
        versionCode parts[0].toInteger() * 1000000 + parts[1].toInteger() * 1000 + parts[2].toInteger() + 1
        versionName releaseName
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [oauthScheme: packageName + '.debug']
            buildConfigField 'String', 'OAUTH_REDIRECT', quoted(packageName + '.debug://oauth/callback')
        }
        release {
            manifestPlaceholders = [oauthScheme: packageName]
            buildConfigField 'String', 'OAUTH_REDIRECT', quoted(packageName + '://oauth/callback')
            if (System.getenv('ANDROID_KEYSTORE')) { signingConfig signingConfigs.release }
            minifyEnabled false
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = variant.buildType.name == 'debug' ? (branded ? packageName + '-preview.apk' : 'mu-android-preview.apk') :
                (branded ? packageName + (System.getenv('ANDROID_KEYSTORE') ? '.apk' : '-unsigned.apk') : (System.getenv('ANDROID_KEYSTORE') ? 'mu-android.apk' : 'mu-android-unsigned.apk'))
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
android.sourceSets.main.proto.srcDir('../../../proto')
android.sourceSets.test.resources.srcDir('../../../proto/testdata')
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.31.1' }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins { java { } }
            // protoc's Java generator does not retain file-level licence comments.
            task.doLast {
                fileTree(task.outputBaseDir).matching { include '**/*.java' }.each { source ->
                    def notice = '// SPDX-License-Identifier: Apache-2.0\n'
                    if (!source.getText('UTF-8').startsWith(notice)) {
                        source.setText(notice + source.getText('UTF-8'), 'UTF-8')
                    }
                }
            }
        }
    }
}
dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'com.google.protobuf:protobuf-java-util:4.31.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'io.noties.markwon:core:4.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def modelAssets = layout.buildDirectory.dir('generated/voice-assets')
android.sourceSets.main.assets.srcDir(modelAssets)
tasks.register('prepareVoiceModel') {
    outputs.dir(modelAssets)
    doLast {
        def checksum = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498'
        def archive = layout.buildDirectory.file('vosk-model.zip').get().asFile
        archive.parentFile.mkdirs()
        def connection = new URI('https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 60000
        connection.inputStream.withCloseable { input -> archive.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        if (digest != checksum) { archive.delete(); throw new GradleException('Voice model checksum mismatch') }
        copy {
            from zipTree(archive)
            into modelAssets
            eachFile { path = path.replaceFirst('vosk-model-small-en-us-0.15', 'model-en-us') }
            includeEmptyDirs = false
        }
        new File(modelAssets.get().asFile, 'model-en-us/uuid').text = checksum
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareVoiceModel' }

// Include the contract licence with the generated types shipped in the APK.
def protocolLicenseAssets = layout.buildDirectory.dir('generated/protocol-license')
android.sourceSets.main.assets.srcDir(protocolLicenseAssets)
tasks.register('prepareProtocolLicense', Copy) {
    from('../../../proto/LICENSE')
    into(protocolLicenseAssets.map { it.dir('licenses') })
    rename { 'MU-PROTOCOL-APACHE-2.0.txt' }
}
tasks.named('preBuild').configure { dependsOn 'prepareProtocolLicense' }

// Generate the launcher resource for each build, keeping brand assets out of source.
def brandResources = layout.buildDirectory.dir('generated/brand-res')
android.sourceSets.main.res.srcDir(brandResources)
tasks.register('prepareBrand') {
    inputs.property('name', appName)
    if (branded) inputs.file(icon)
    outputs.dir(brandResources)
    doLast {
        delete brandResources
        def target = new File(brandResources.get().asFile, 'drawable/app_icon.png')
        target.parentFile.mkdirs()
        if (branded) target.bytes = icon.bytes
        else {
            def vector = new File(target.parentFile, 'app_icon.xml')
            vector.text = '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#202020" android:pathData="M25,78V30h12l17,25 17,-25h12v48H70V52L54,75 38,52v26z"/></vector>'
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareBrand' }
