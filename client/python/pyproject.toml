[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-mu"
version = "0.1.0"
description = "Async Mu assistant and MUCP client"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"

[tool.setuptools.package-data]
mu = ["py.typed"]
